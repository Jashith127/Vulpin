<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffffb" />
    <meta name="description" content="Vulpin — a source-aware, personalized learning prototype." />
    <title>Vulpin — Intelligent Study</title>
    <link rel="stylesheet" href="styles.css?v=selection-source-5" />

  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="app" aria-live="polite"></div>
    <div id="selection-menu" class="selection-menu" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="confirm-modal" class="modal-overlay" hidden>
      <div class="modal-card">
        <h3>Exit to Learning Space?</h3>

        <div class="modal-actions">
          <button class="button secondary button-md" data-action="modal-cancel">Stay here</button>
          <button class="button primary button-md" data-action="modal-confirm">Exit</button>
        </div>
      </div>
    </div>
